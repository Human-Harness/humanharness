<title>Dev Harness prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f5f5f7;--side:#ececf0;--card:#fff;--card2:#fbfbfd;--line:#e3e3e8;--line2:#d2d2d7;--fg:#1d1d1f;--fg2:#3a3a40;--muted:#5f5f66;
  --sel:#dcdce2;--accent:#0a5bc4;--link:#0a5bc4;--acc-soft:#dbe8fb;--acc-ink:#0a3f8a;
  --wait:#e8a33d;--wait-soft:#fdebd0;--wait-ink:#7a4a00;--wait-bg:#fffaf1;
  --ok-soft:#d9f0dc;--ok-ink:#1f5a28;--err:#c0392b;--err-soft:#f7d9d6;--err-ink:#8a1c12;
  --neutral:#ececf0;--overlay:rgba(29,29,31,.35);--con-bg:#1c1c20;--con-line:#2e2e34;--con-fg:#e6e6ea;--con-ok:#8fd18f;
  --add-bg:#e6f4e8;--del-bg:#fbe9e7;--toast:#1d1d1f;--toast-fg:#fff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161618;--side:#1f1f22;--card:#232326;--card2:#26262a;--line:#38383d;--line2:#4a4a50;--fg:#f2f2f5;--fg2:#c9c9d0;--muted:#9a9aa3;
  --sel:#34343a;--accent:#0a5bc4;--link:#6aa8ff;--acc-soft:#1c3256;--acc-ink:#a9c8f5;
  --wait:#b9822f;--wait-soft:#4a3410;--wait-ink:#f5c77a;--wait-bg:#2a2214;
  --ok-soft:#1d3a22;--ok-ink:#8fd49a;--err:#d0574b;--err-soft:#4a1f1b;--err-ink:#f2a59c;
  --neutral:#34343a;--overlay:rgba(0,0,0,.55);--con-bg:#111114;--con-line:#2e2e34;--con-fg:#e6e6ea;--con-ok:#8fd18f;
  --add-bg:#1d3a22;--del-bg:#4a1f1b;--toast:#f2f2f5;--toast-fg:#1d1d1f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161618;--side:#1f1f22;--card:#232326;--card2:#26262a;--line:#38383d;--line2:#4a4a50;--fg:#f2f2f5;--fg2:#c9c9d0;--muted:#9a9aa3;
  --sel:#34343a;--accent:#0a5bc4;--link:#6aa8ff;--acc-soft:#1c3256;--acc-ink:#a9c8f5;
  --wait:#b9822f;--wait-soft:#4a3410;--wait-ink:#f5c77a;--wait-bg:#2a2214;
  --ok-soft:#1d3a22;--ok-ink:#8fd49a;--err:#d0574b;--err-soft:#4a1f1b;--err-ink:#f2a59c;
  --neutral:#34343a;--overlay:rgba(0,0,0,.55);--con-bg:#111114;--con-line:#2e2e34;--con-fg:#e6e6ea;--con-ok:#8fd18f;
  --add-bg:#1d3a22;--del-bg:#4a1f1b;--toast:#f2f2f5;--toast-fg:#1d1d1f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
a{color:var(--link);cursor:pointer}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.muted{color:var(--muted)}.fg2{color:var(--fg2)}.s12{font-size:12px}.s13{font-size:13px}
.ok{color:var(--ok-ink)}.err{color:var(--err-ink)}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;display:inline-block;background:var(--neutral);color:var(--fg2)}
.pill.wait{background:var(--wait-soft);color:var(--wait-ink)}.pill.run{background:var(--acc-soft);color:var(--acc-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}.pill.err{background:var(--err-soft);color:var(--err-ink)}
.btn{font-size:13px;padding:7px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.lg{font-size:14px;padding:10px 20px;border-radius:8px}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.on{background:var(--acc-soft);border-color:var(--accent)}
.row{display:flex;gap:10px;font-size:13px;line-height:1.45;align-items:flex-start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.wait{border-color:var(--wait)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.spin{width:12px;height:12px;border:2px solid var(--acc-soft);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:6px;background:var(--neutral);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
/* app shell */
.app{display:flex;min-height:100vh}
.side{width:220px;flex:none;padding:20px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);background:var(--side);position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{font-weight:700;font-size:15px;padding:0 10px 14px}
.side a.nv{padding:7px 10px;border-radius:7px;color:var(--fg);text-decoration:none;font-size:14px;display:flex;gap:6px;align-items:center}
.side a.nv:hover{background:var(--sel)}.side a.nv.on{background:var(--sel);font-weight:600}
.side a.add{color:var(--link)}
.side .badge{margin-left:auto;font-size:11px;background:var(--wait-soft);color:var(--wait-ink);border-radius:999px;padding:1px 7px;font-weight:700}
.side .reset{font-size:11px;color:var(--muted);padding:6px 10px;cursor:pointer;background:none;border:0;text-align:left}
.main{flex:1;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .grow{flex:1;min-width:200px}
/* centered setup screens */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 0;position:relative;text-align:center}
.steps{display:flex;gap:8px;list-style:none;margin:0;padding:0;flex-wrap:wrap;justify-content:center}
.st{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--neutral);color:var(--muted)}
.st.cur{background:var(--accent);color:#fff;font-weight:600}.st.done{background:var(--ok-soft);color:var(--ok-ink)}
.tile{width:300px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer}
.tile.on{border:2px solid var(--accent)}
.choice{width:340px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--fg);text-align:left;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.gear{position:absolute;top:20px;right:8px;width:44px;height:44px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
/* forms */
input[type=text],textarea,select{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--fg);max-width:100%}
textarea{resize:vertical;line-height:1.5}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--acc-soft)}
.it{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;cursor:pointer;line-height:1.45}
.it.on{border-color:var(--accent)}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.col.soft{background:var(--card2)}
/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.bcol{background:var(--side);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.t{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px;text-decoration:none;color:var(--fg);cursor:pointer;text-align:left}
.t:hover{border-color:var(--accent)}
.t.new{animation:flash 2s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap}
.tab{font-size:13px;padding:6px 12px;border-radius:7px;border:0;background:transparent;cursor:pointer}
.tab.on{background:var(--sel);font-weight:600}
/* ticket */
.tk{display:flex;flex-direction:column;min-height:100vh}
.tkh{display:flex;flex-direction:column;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card);margin:0 -16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.tkh .r1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper{display:flex;gap:6px;margin:0;padding:0;list-style:none;flex-wrap:wrap}
.step{font-size:12px;padding:6px 12px;border-radius:999px;color:var(--muted);background:var(--neutral)}
.step.done{background:var(--ok-soft);color:var(--ok-ink)}.step.cur{background:var(--accent);color:#fff;font-weight:600}
.seg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{font-size:12px;padding:6px 10px;border:0;background:var(--card);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.tkb{flex:1;display:flex;min-height:0;margin:0 -16px}
.pane{padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--card);min-width:0}
.pane.l{width:300px;flex:none;border-right:1px solid var(--line)}
.pane.r{width:300px;flex:none;border-left:1px solid var(--line)}
.center-pane{flex:1;padding:22px 26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.opt{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--card);min-width:0}
.opt.rec{border-color:var(--accent)}
.who{font-size:11px;font-weight:700;width:34px;flex:none;padding-top:2px}
.dec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dec.wait{border-color:var(--wait)}.dec.errb{border-color:var(--err)}
.drawerbar{display:flex;align-items:center;gap:10px;padding:10px 24px;border-top:1px solid var(--line);background:var(--side);position:sticky;bottom:0;margin:0 -16px;flex-wrap:wrap;
  padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.drawer{background:var(--con-bg);color:var(--con-fg);height:320px;display:flex;flex-direction:column;margin:0 -16px;border-top:1px solid var(--line)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:1.6}
.con{flex:1;display:flex;flex-direction:column;background:var(--con-bg);min-width:0;min-height:0}
.con .ctabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--con-line);flex-wrap:wrap}
.con .ctabs button{font-size:12px;padding:5px 10px;border-radius:6px;border:0;background:transparent;color:#aaa;cursor:pointer}
.con .ctabs button.on{background:var(--con-line);color:#fff}
.con .out{flex:1;padding:14px 20px;color:var(--con-fg);overflow:auto;min-height:200px;white-space:pre-wrap;word-break:break-word}
.con .u{color:var(--con-ok)}.con .s{color:#8a8a95}
.con .in{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--con-line)}
.con .in input{flex:1;background:#2a2a30;border:1px solid #3a3a42;color:#fff;font-family:ui-monospace,Menlo,monospace;font-size:13px;min-width:0}
.diff{flex:1;overflow:auto;padding:10px 0;background:var(--card);color:var(--fg)}
.diff .f{padding:6px 16px;font-weight:600;background:var(--side);font-size:12px}
.diff .l{padding:0 16px;white-space:pre}.diff .a{background:var(--add-bg)}.diff .d{background:var(--del-bg)}
/* modal + toast */
.mbg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{width:980px;max-width:100%;max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.set{width:820px;background:var(--bg)}
.modal .mh{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal .mf{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 18px}
.sbox .row{padding:12px 0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}.sbox .row:last-child{border:0}
.toasts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80;max-width:calc(100vw - 32px);pointer-events:none}
.toast{background:var(--toast);color:var(--toast-fg);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:380px;animation:tin .2s}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.list .li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center;cursor:pointer;flex-wrap:wrap}
.list .li:last-child{border:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.box .row{padding:8px 0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}.box .row:last-child{border:0}
.hide-sm{}
@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px;gap:4px;align-items:center}
  .side .brand{padding:0 8px 0 0}.side .k,.side .sp{display:none}
  .main{padding:20px 0}
  .grid2,.grid3,.board{grid-template-columns:minmax(0,1fr)}
  .tkb{flex-direction:column}.pane.l,.pane.r{width:auto;border:0;border-top:1px solid var(--line)}
  .center-pane{padding:18px 16px}
  .tkh,.drawerbar{padding-left:16px;padding-right:16px}
  .hide-sm{display:none}
  .wrapcols{flex-direction:column}
  .wrapcols>*{width:auto!important}
}
</style>

function conLine(t,k,txt){t.con.push({k,t:txt});if(t.con.length>200)t.con.shift();}
function startStage(t,st){
  t.stage=st;t.run=true;t.prog=0;t.wait=null;t.cd=DUR[st];
  t.jiraCheck='Comparando el ticket con Jira…';
  conLine(t,'s',`[jira] Comparando ${t.key} con Jira antes de ${STAGES[st]}…`);
  setTimeout(()=>{t.jiraCheck='✓ Ticket comparado con Jira al empezar la etapa: sin cambios';conLine(t,'s',`[jira] ${t.key}: sin cambios`);dirty();},1200);
}
function stepLines(t){
  if(t.stage===0)return ['Leí el ticket, sus criterios y comentarios.','Revisé los tickets linkeados y las notas del proyecto.',`Encontré el código relacionado en ${t.repos.join(', ')||'el repo'}.`];
  if(t.stage===2)return implSteps(t).map(s=>s+' ✓');
  return ['Abrí el PR con la descripción armada desde las decisiones.'];
}
function implSteps(t){return ['Preparar worktree y branch','Cambios en el backend','Cambios en la interfaz','Tests de los criterios','Correr tests y lint'];}
function genPlans(t){
  const r=t.repos.join(', ')||'el repo';const acs=t.ac.map((_,i)=>'AC'+(i+1)).join(' ');
  t.planSummary='La IA propone 2 planes. Difieren en cuánto código nuevo agregan.';
  t.plans=[{id:'A',name:'Cambio acotado sobre lo que existe',rec:true,desc:`Resolver "${t.title}" extendiendo el código actual de ${r}, sin piezas nuevas.`,pro:'Menos archivos · sigue las convenciones del proyecto',con:'Si el alcance crece, va a pedir un refactor',touch:`Toca ${r} (4 archivos) · ${acs}`},
           {id:'B',name:'Módulo nuevo reutilizable',desc:'Separar la lógica en un módulo propio, con su API y sus tests.',pro:'Más fácil de testear y de reusar',con:'Más código y una abstracción que hoy usa un solo lugar',touch:`Toca ${r} (7 archivos) · ${acs}`}];
}
function genReview(t){
  const a0=t.ac[0]||'el pedido del ticket';
  t.reviewMeta='6 archivos · +128 −14 · tests: 23 ok';
  t.review=[{id:1,st:'pending',ac:t.ac[0]?'AC1':'',title:'Reusé el componente existente en lugar de crear uno nuevo',why:'Mantiene el estilo actual y achica el diff.',diff:'2 archivos'},
            {id:2,st:'pending',ac:t.ac[1]?'AC2':'',title:'La lógica vive en la API; la web solo muestra el resultado',why:'Así los criterios se prueban sin navegador.',diff:'3 archivos'},
            {id:3,st:'pending',assume:true,ac:'AC1',title:`Interpreté "${a0.replace(/\.$/,'')}" también para usuarios sin sesión`,why:'El ticket no lo aclara.',diff:'1 archivo'},
            {id:4,st:'pending',title:'Agregué una migración chica con un campo nuevo',why:'Hacía falta guardar el dato para cumplir el criterio.',diff:'1 migración'}];
  t.coverage=t.ac.map((_,i)=>[i===t.ac.length-1?'wait':'ok','AC'+(i+1),i===t.ac.length-1?'Cubierto sin test automático':'Cubierto · '+(2+i)+' tests']);
  t.outside='Nada fuera del plan.';
}
function genFeedback(t){
  t.approvals='0 de 2';
  t.fb=openFb([{id:1,kind:'ci',tag:'CI',title:'Falla el e2e del flujo principal',body:'Causa probable: un selector cambió con el componente reusado. No es un error de la lógica.',
         acts:[{l:'Arreglar el test',p:1,t:'work',r:'El agente actualizó el selector. CI en verde.'},{l:'Ver el log',t:'log'},{l:'Volver a correr',t:'work',r:'Se volvió a correr: falló igual.',keep:1}]},
        {id:2,kind:'rev',tag:'Review · ana-dev',title:'"¿No debería ir detrás de un feature flag?"',body:'El proyecto usa flags para cambios visibles al cliente. Opciones: agregarlo o explicar por qué no.',
         acts:[{l:'Agregar feature flag',p:1,t:'work',r:'Flag agregado y respondido en GitHub.'},{l:'Contestar sin cambiar',t:'reply',r:'Respondiste sin cambios.'},{l:'Preguntar al PO en Jira',t:'po'}]}]);
}
function finishStage(t){
  t.run=false;
  if(t.stage===0){t.stage=1;t.wait='plan';if(!t.plans.length)genPlans(t);t.model='profundo';
    conLine(t,'a','');t.plans.forEach(p=>conLine(t,'a',`Plan ${p.id}: ${p.name}`));conLine(t,'a','¿Cuál preferís?');
    toast(`${t.key} te espera: elegir plan`);
    if(t.aut==='pr')setTimeout(()=>{if(t.stage===1&&t.wait==='plan'){choosePlan(t,'A',true);}},1500);
  } else if(t.stage===2){t.stage=3;t.wait='review';if(!t.review.length)genReview(t);
    conLine(t,'a','Implementación lista. Dejé las decisiones para que las revises.');toast(`${t.key} te espera: revisar decisiones`);
  } else if(t.stage===4){t.stage=5;t.wait='feedback';t.pr=t.pr||(++S.prSeq);t.status='review';if(!t.fb.length)genFeedback(t);
    conLine(t,'a',`PR #${t.pr} abierto. Jira: En review.`);toast(`PR #${t.pr} abierto · ${t.key} pasó a En review en Jira`);
    setTimeout(()=>{toast(`${t.key}: volvieron comentarios y el CI`);},2500);
  }
}
function tick(){
  let ch=false;
  S.tickets.forEach(t=>{
    if(t.run){ch=true;t.cd--;S.usage=Math.min(99,S.usage+0.03);t.tokens+=1;
      if(t.cd<=0){const lines=stepLines(t);conLine(t,'a',lines[t.prog]||'…');t.prog++;t.cd=DUR[t.stage];if(t.prog>=STEPS[t.stage])finishStage(t);}}
    t.review.forEach(r=>{if(r.cd>0){ch=true;r.cd--;if(r.cd<=0){r.st='ok';if(r.doneNote)r.note=r.doneNote;toast(r.doneMsg||`${t.key}: decisión actualizada`);}}});
    t.fb.forEach(f=>{if(f.cd>0){ch=true;f.cd--;if(f.cd<=0){if(f.keepOpen){f.st='open';f.note=f.pendingNote;}else{f.st='done';f.note=f.pendingNote;}toast(`${t.key}: ${f.pendingNote}`);
      if(t.fb.every(x=>x.st==='done')){t.wait='merge';t.approvals='2 de 2';toast(`${t.key}: CI en verde y 2 aprobaciones. Listo para mergear.`);}}}});
  });
  if(ch)dirty();
}
setInterval(tick,1000);

function vHoy(){
  if(!S.projects.length)return shell('hoy',vEmpty(false));
  const ts=S.tickets;const w=ts.filter(waiting);const run=ts.filter(t=>t.run||(t.wait==='feedback'));
  const prc=ts.filter(t=>t.wait==='feedback'&&t.fb.some(f=>f.kind==='rev'&&f.st!=='done')).length;
  const next=ts.filter(t=>t.status==='todo').sort((a,b)=>(a.prio==='Alta'?0:1)-(b.prio==='Alta'?0:1));
  const wcard=t=>{const i=stageInfo(t);const desc=t.wait==='plan'?t.planSummary:t.wait==='review'?`Implementación lista. ${t.review.filter(r=>r.st!=='ok').length} decisiones de la IA para revisar antes de abrir el PR; ${t.review.filter(r=>r.assume&&r.st!=='ok').length} supuesto marcado.`:`Comentarios resueltos y CI en verde. PR #${t.pr} con ${t.approvals} aprobaciones.`;
    return `<div class="card wait"><div class="row" style="align-items:center"><span class="pill wait">${i.label}</span><span class="k">${t.key}</span></div>
      <div style="font-size:16px;font-weight:600">${esc(t.title)}</div><div class="s13 fg2">${esc(desc)}</div>
      <div><a class="btn p" href="#/t/${t.key}">${t.wait==='plan'?'Ver planes':t.wait==='review'?'Revisar decisiones':'Ver PR'}</a></div></div>`;};
  const rcard=t=>{const i=stageInfo(t);const sub=t.wait==='feedback'?`PR #${t.pr} · ${t.fb.filter(f=>f.kind==='rev'&&f.st!=='done').length} comentarios de review · ${t.fb.some(f=>f.kind==='ci'&&f.st!=='done')?'test e2e falla':'CI en verde'}`:`worktree ${t.key.toLowerCase()} · ${t.repos.join(', ')} · modelo ${t.model}`;
    return `<a class="card t" href="#/t/${t.key}" style="padding:16px"><div class="row" style="align-items:center"><span class="pill ${i.cls}">${i.label}</span><span class="k">${t.key}</span>${t.run?'<span class="spin" style="margin-left:auto"></span>':''}</div>
      <div style="font-size:15px;font-weight:600">${esc(t.title)}</div><div class="s12 muted">${sub}</div>
      ${t.run&&t.stage===2?`<div class="bar"><i style="width:${t.prog/STEPS[2]*100}%"></i></div>`:''}${t.wait==='feedback'?'<span class="s13" style="color:var(--link)">Ver qué pasó</span>':''}</a>`;};
  return shell('hoy',`<div class="head"><div class="grow"><h1 style="font-size:26px">Hoy</h1>
      <div class="muted" style="margin-top:4px">${(n=>n+(n===1?' agente trabajando':' agentes trabajando'))(ts.filter(t=>t.run).length)} · ${w.length} te ${w.length===1?'espera':'esperan'} · ${prc} PR con comentarios</div></div>
      <span class="s12 muted">${syncLabel()}</span>${syncBtn()}
      <button class="btn" data-a="settings" data-v="Uso">Uso del plan: ${Math.round(S.usage)}% de 5 h</button>
      <button class="btn p" data-a="take">Tomar ticket de Jira</button></div>
    <section style="display:flex;flex-direction:column;gap:10px"><h2 class="k">TE ESPERAN</h2>
      ${w.length?`<div class="grid2">${w.map(wcard).join('')}</div>`:'<div class="card s13 muted">Nada te espera. Los agentes siguen trabajando.</div>'}</section>
    <section style="display:flex;flex-direction:column;gap:10px"><h2 class="k">EN CURSO</h2>
      ${run.length?`<div class="grid3">${run.map(rcard).join('')}</div>`:'<div class="card s13 muted">Ningún agente trabajando. Tomá un ticket para empezar.</div>'}</section>
    <section style="display:flex;flex-direction:column;gap:10px"><h2 class="k">SIGUIENTES EN JIRA (asignados a vos)</h2>
      ${next.length?`<div class="list">${next.slice(0,5).map(t=>`<div class="li" data-a="take" data-v="${t.key}"><span class="k" style="width:80px">${t.key}</span><span style="flex:1">${esc(t.title)}${t.isNew?' <span class="pill run">nuevo</span>':''}</span><span class="muted">${esc(pj(t.proj)?.sprint||'')} · ${t.prio}</span></div>`).join('')}</div>`:'<div class="card s13 muted">No hay tickets asignados sin empezar.</div>'}</section>`);
}

function vCrearStack(){

/* ---------- ticket ---------- */
function stepper(t){
  const cur=t.stage;return `<ol class="stepper" aria-label="Etapas">${STAGES.map((s,i)=>{
    let lbl=s;if(i===cur){if(waiting(t)||t.wait==='feedback')lbl+=t.wait==='review'?` · ${t.review.filter(r=>r.st==='ok').length} de ${t.review.length}`:t.wait==='feedback'?` · ${t.fb.filter(f=>f.st!=='done').length} cosas`:' · te espera';else if(t.run)lbl+=' · agente';}
    return `<li class="step ${i<cur||t.status==='done'?'done':i===cur?'cur':''}">${i<cur||t.status==='done'?'✓ ':''}${lbl}</li>`;}).join('')}</ol>`;
}
const jiraState=t=>({todo:'To Do',prog:'En progreso',review:'En review',done:'Hecho'}[t.status]);

        <div class="k">PR · CI</div><div class="s13 muted">${t.pr?`PR #${t.pr} · ${t.fb.some(f=>f.kind==='ci'&&f.st!=='done')?'CI en rojo':'CI en verde'}`:'Sin PR'}</div></aside></div>${drawer(t,false)}</div>`;
  let body;

function logSection(t){

function reviewBody(t){
  const pend=t.review.filter(r=>r.st!=='ok').length;const lab={ok:['ok','Aprobada'],pending:['','Sin revisar'],changing:['run','La IA lo cambia…'],asked:['wait','Esperando al PO']};

function feedbackBody(t){

function fakeDiff(t){

  const files=[[`${r0}/src/${k.split('-')[0]}/${slug(t.title).slice(0,24)}.ts`,[[' ','import { db } from "../db";'],['-','export function legacy() {'],['+',`// ${t.key}: ${t.title}`],['+','export async function handle(input: Input) {'],['+','  const result = await db.query(input);'],['+','  return toResponse(result);'],[' ','}']]],
               [`${t.repos[1]||r0}/components/${slug(t.title).slice(0,18)}.tsx`,[[' ','export function View() {'],['-','  return <Old />;'],['+','  const data = useData();'],['+','  return <New data={data} />;'],[' ','}']]],
               [`${r0}/test/${k}.test.ts`,[['+',`describe("${t.key}", () => {`],['+',`  it("${(t.ac[0]||'cumple el criterio').replace(/"/g,"'")}", async () => {`],['+','    expect(await handle(sample)).toMatchSnapshot();'],['+','  });'],['+','});']]]];
  if(!diffCount(t))return '<div class="l muted" style="padding:16px">Sin cambios todavía. El agente no empezó a implementar.</div>';

}

/* ---------- main render ---------- */
function render(){
  pending=false;
  let r=route();
  if(!S.setup&&r[0]!=='setup'){r=['setup','1'];history.replaceState(null,'','#/setup/1');}
  let html;
  switch(r[0]){
    case 'setup':html=vSetup(+r[1]||1);break;
    case 'nuevo':html=shell('',vEmpty(S.projects.length>0));break;
    case 'importar':if(!S.imp)initImport();html=vImport();break;
    case 'crear':if(!S.create||(S.create.build>=5&&r[1]!=='confirmar'))initCreate();html=r[1]==='stack'?vCrearStack():r[1]==='confirmar'?vCrearConfirm():vCrearIdea();break;
    case 'p':html=r[2]==='ajustes'?vProjSettings(r[1]):vProject(r[1]);break;
    case 't':html=vTicket(r[1]);break;
    case 'tickets':case 'prs':html=vAll(r[0]);break;
    default:html=vHoy();
  }
  const m=S.ui.modal;
  if(m)html+=`<div class="mbg" data-a="bgclose">${m.type==='take'?mTake(m):m.type==='newT'?mNewT(m):mSettings(m)}</div>`;
  const root=$('#root');const st=window.scrollY;const out=document.getElementById('conout');const atBottom=!out||out.scrollTop+out.clientHeight>=out.scrollHeight-20;

}

        S.projects.push({key:c.key,name:c.name,sprint:c.sprint,repos:repos.map(r=>({...r})),notes:im.notes.map(n=>({k:n.k,v:n.v}))});
        seedTickets(c.key).filter(t=>t.status==='todo'||t.status==='done'||repos.some(r=>t.repos.includes(r.short))).forEach(addTicket);
        S.imp=null;S.jiraAt=Date.now();S.jiraLabel='al importar';toast(`${c.key} importado con ${repos.length} repo${repos.length>1?'s':''}. Los agentes de los tickets en curso siguen donde estaban.`);go('#/p/'+c.key);}
      dirty();},900);},
  // create
  kind:(v)=>{const k=S.create.kinds;const i=k.indexOf(v);i>=0?k.splice(i,1):k.push(v);},
  ans:(v,w)=>{S.create.ans[v]=w;delete S.create.stack.login;},
  std:()=>{S.create.std=true;toast('Repo de referencia agregado. La IA va a seguir sus convenciones.');},
  toStack:()=>{const c=S.create;QS.forEach(q=>{if(!c.ans[q.id])c.ans[q.id]=q.o[0];});c.thinking=true;
    setTimeout(()=>{c.thinking=false;const auth=c.ans.auth==='Cuenta con login';c.stack=Object.assign({repos:'mono',front:'next',db:'pg',login:auth?'pass':'magic'},{hosting:c.stack.hosting,ci:c.stack.ci});
      if(!c.stack.hosting)delete c.stack.hosting;if(!c.stack.ci)delete c.stack.ci;go('#/crear/stack');dirty();},1500);},
  stack:(v,w)=>{S.create.stack[v]=w;},
  stackAsk:()=>{const q=(S.ui.stackQ||'').trim();if(!q)return toast('Escribí una pregunta para la IA.');S.ui.stackQ='';
    S.create.qa.push({q,a:'Pensando…'});const i=S.create.qa.length-1;
    setTimeout(()=>{S.create.qa[i].a='Buena pregunta. Con lo que respondiste, las opciones de arriba siguen siendo las más simples; si querés otra, decime cuál y la sumo con sus pros y contras.';dirty();},1500);},
  toConfirm:()=>go('#/crear/confirmar'),
  firstT:(v)=>{const c=S.create;c.firsts[v]=!isFirstOn(c,+v);},
  build:()=>{const c=S.create;c.build=0;c.sub=0;
    const iv=setInterval(()=>{if(c.build===2&&c.sub<6){c.sub++;}else{c.build++;}
      if(c.build>=5){clearInterval(iv);finishCreate();}dirty();},700);},
  // project
  ptab:(v)=>{S.ui.ptab=v;},
  pfilter:(v)=>{S.ui.pfilter=v;if(v!=='Sprint 14')toast(v==='Todo el backlog'?'En el prototipo el backlog muestra lo mismo que el sprint.':'Todos los tickets ya están asignados a vos.');},
  newT:(v)=>{S.ui.modal={type:'newT',proj:v};S.ui.ntTitle='';},
  createT:()=>{const m=S.ui.modal;const ti=(S.ui.ntTitle||'').trim();if(!ti)return toast('Poné un título.');m.busy=true;
    setTimeout(()=>{const n=S.tickets.filter(t=>t.proj===m.proj).reduce((a,t)=>Math.max(a,+t.key.split('-')[1]),0)+1;const key=`${m.proj}-${n}`;
      addTicket(T({key,proj:m.proj,title:ti,desc:ti+'.',isNew:true,repos:pj(m.proj).repos.slice(0,1).map(r=>r.short),proposedAC:['El cambio se ve en la pantalla correspondiente.','Hay un test que lo cubre.']}));
      S.ui.modal=null;toast(`El agente creó ${key} en Jira.`);dirty();},1300);},
  editNote:(v)=>{const r=route();S.ui.editNote=r[1]+v;S.ui.noteDraft=pj(r[1]).notes[+v].v;},
  saveNote:(v)=>{const r=route();const n=pj(r[1]).notes[+v];n.v=S.ui.noteDraft;n.src='editada por vos';S.ui.editNote=null;toast('Nota guardada. Los próximos agentes la usan.');},
  // take ticket
  take:(v)=>{if(!v){S.ui.modal={type:'take'};return;}const t=tk(v);S.ui.modal={type:'take',key:v,mode:'dec',aut:'plan',repos:t.repos.slice(),ready:null};},
  showAC:()=>{S.ui.modal.ready='show';},skipAC:()=>{S.ui.modal.ready='skip';},
  useAC:()=>{const t=tk(S.ui.modal.key);t.ac=t.proposedAC.slice();t.log.push({who:'VOS',text:'Criterios propuestos por la IA aceptados. El agente los escribe en Jira.',st:'Entender'});toast(`Criterios agregados a ${t.key}. El agente los sube a Jira.`);},
  askPO:()=>{const k=S.ui.modal?S.ui.modal.key:'';toast(`El agente comentó en ${k} en Jira preguntándole al PO. Te avisa cuando responda.`);},
  takeRepo:(v)=>{const r=S.ui.modal.repos;const i=r.indexOf(v);i>=0?r.splice(i,1):r.push(v);},
  takeMode:(v)=>{S.ui.modal.mode=v;},takeAut:(v)=>{S.ui.modal.aut=v;},
  startT:()=>{const m=S.ui.modal;const t=tk(m.key);t.status='prog';t.mode=m.mode;t.aut=m.aut;t.repos=m.repos.slice();t.isNew=false;t.branch=`${t.key.toLowerCase()}-${slug(t.title).split('-')[0]}`;
    t.ctx=[`Ticket${t.ac.length?`, ${t.ac.length} criterios`:''}`,'Notas del proyecto'];t.tokens=0;t.model='estándar';
    conLine(t,'s',`[app] branch ${t.branch} · worktree en ${t.repos.join(', ')}`);conLine(t,'s',`[jira] ${t.key} → En progreso, asignado a vos`);conLine(t,'u','> Leé el ticket y proponé un plan');
    startStage(t,0);S.ui.modal=null;toast(`${t.key} en progreso. El agente arrancó la etapa Entender.`);go('#/t/'+t.key);},
  // ticket
  open:(v)=>go('#/t/'+v),
  mode:(v)=>{const t=tk(route()[1]);t.mode=v;S.ui.drawer=null;},
  drawer:(v)=>{S.ui.drawer=S.ui.drawer===v||!v?null:v;},
  ctab:(v)=>{S.ui.ctab=v;},
  editor:()=>{const t=tk(route()[1]);toast(`Abriendo el worktree ${t.key.toLowerCase()} en tu editor (simulado).`);},
  addCtx:()=>{const t=tk(route()[1]);t.ctx.push('docs/arquitectura.md (fijado por vos)');toast('Archivo fijado. La IA lo tiene en cuenta desde ahora.');},
  plan:(v)=>{choosePlan(tk(route()[1]),v);},
  planAsk:()=>{const t=tk(route()[1]);const q=(S.ui.planQ||'').trim();if(!q)return toast('Escribí qué querés ajustar.');S.ui.planQ='';S.ui.planAsk=t.key;
    t.log.push({who:'VOS',text:`Pedido para el plan: ${q}`,st:'Planificar'});
    setTimeout(()=>{S.ui.planAsk=null;const id=String.fromCharCode(65+t.plans.length);t.plans.push({id,name:'Según tu pedido',mine:true,desc:q,pro:'Responde a lo que pediste',con:'La IA no lo pudo comparar a fondo todavía',touch:`Toca ${t.repos.join(', ')} · revisar criterios`});
      toast(`La IA sumó el plan ${id}.`);dirty();},2200);},
  confirmAssume:(v)=>{const t=tk(route()[1]);t.log[+v].ok=true;toast('Supuesto confirmado. Queda anotado en el ticket y en el PR.');},
  rv:(v,w)=>{const t=tk(route()[1]);const r=t.review.find(x=>x.id==v);
    if(w==='ok'){r.st='ok';const left=t.review.filter(x=>x.st!=='ok').length;toast(left?`Aprobada. Faltan ${left}.`:'Todas revisadas. Ya podés abrir el PR.');}
    else if(w==='change'){S.ui.changing=t.key+r.id;S.ui.changeQ='';}
    else {r.st='asked';r.cd=7;r.note='';r.doneMsg=`${t.key}: el PO respondió en Jira. Decisión aprobada.`;r.doneNote='PO en Jira: "Está bien así."';toast('El agente preguntó al PO en Jira. Te avisa cuando responda.');}},
  changeSend:(v)=>{const t=tk(route()[1]);const r=t.review.find(x=>x.id==v);const q=(S.ui.changeQ||'').trim();if(!q)return toast('Contale a la IA qué cambiar.');
    r.st='changing';r.cd=4;r.note=`Cambiado según tu pedido: ${q}`;r.doneMsg=`${t.key}: la IA aplicó tu cambio.`;S.ui.changing=null;S.ui.changeQ='';
    t.log.push({who:'VOS',text:`Cambio pedido en review: ${q}`,st:'Revisar'});toast('La IA está aplicando el cambio.');},
  changeCancel:()=>{S.ui.changing=null;},
  openPR:()=>{const t=tk(route()[1]);const p=t.review.filter(r=>r.st!=='ok').length;
    if(t.stage!==3)return;if(p){toast(`Faltan ${p} decisiones por revisar. Pasá a modo Decisiones.`);return;}
    t.mode='dec';t.status='review';startStage(t,4);toast(`${t.key}: abriendo el PR.`);},
  fb:(v,w)=>{const t=tk(route()[1]);const f=t.fb.find(x=>x.id==v);const a=f.acts[+w];
    if(a.t==='log'){f.note='Log: expected "$90" but got "$100" (checkout.spec.ts:42). El carrito no había cargado.';toast('Log del CI: la línea clave quedó en la tarjeta.');return;}
    if(a.t==='reply'){f.st='done';f.note=a.r;toast(a.r);}
    else if(a.t==='po'){f.st='working';f.cd=6;f.pendingNote='El PO respondió en Jira: "desactivar los cupones". El agente lo implementó.';toast('El agente preguntó al PO en Jira.');}
    else{f.st='working';f.cd=4;f.pendingNote=a.r;f.keepOpen=!!a.keep;}
    if(t.fb.every(x=>x.st==='done')){t.wait='merge';t.approvals='2 de 2';toast(`${t.key}: listo para mergear.`);}},
  merge:()=>{const t=tk(route()[1]);t.status='done';t.stage=6;t.wait=null;t.run=false;toast(`PR #${t.pr} mergeado. ${t.key} pasó a Hecho en Jira y se borró el worktree.`);},
  conSend:()=>{const t=tk(route()[1]);const q=(S.ui.conQ||'').trim();if(!q)return;S.ui.conQ='';conLine(t,'u','> '+q);
    setTimeout(()=>{if(t.stage===1&&t.wait==='plan'){const m=q.match(/\b([ab])\b/i);if(m){conLine(t,'a',`Voy con el plan ${m[1].toUpperCase()}.`);choosePlan(t,m[1].toUpperCase());return;}}
      conLine(t,'a',t.run?'Anotado. Lo tengo en cuenta en lo que sigue de esta etapa.':'Anotado. ¿Algo más antes de seguir?');dirty();},900);},
};
function finishCreate(){
  const c=S.create;const key=pkey(c);const ft=firstTickets(c);const repo=slug(c.name);
  const defs=stackDefs(c);
  S.projects.push({key,name:c.name,sprint:'Kanban',repos:[{name:`${c.owner}/${repo}`,short:repo}],
    notes:[{k:'STACK',v:stackSummary(c)},{k:'CÓMO SE PRUEBA',v:c.stack.ci==='unit'?'pnpm test (Vitest)':'pnpm test (Vitest) · pnpm e2e (Playwright)'},{k:'CONVENCIONES',v:'Branches KEY-desc · commits convencionales'}],
    adr:defs.map(d=>`${d.name}: ${(d.o.find(o=>o.id===c.stack[d.id])||{}).l}`)});
  let n=0;ft.forEach((l,i)=>{if(isFirstOn(c,i)){n++;addTicket(T({key:`${key}-${n}`,proj:key,title:l,desc:l+'.',repos:[repo],prio:i<2?'Alta':'Media',
    ac:i===4?[]:['Funciona en la web y en el celular.','Hay un test que lo cubre.'],proposedAC:['La decisión queda escrita como ADR.','Se actualiza el README.']}));}});
  if(INCOMING.TURN&&key!=='TURN'){INCOMING[key]=INCOMING.TURN.map(x=>Object.assign({},x,{key:x.key.replace('TURN',key),repos:[repo]}));}
  toast(`${c.name} creado: repo en GitHub, proyecto ${key} en Jira y ${n} tickets.`);
}

/* ---------- event delegation ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=A[el.dataset.a];if(!a)return;
  if(el.tagName==='A'||el.tagName==='BUTTON')e.preventDefault();
  if(el.tagName==='LABEL'&&e.target.tagName!=='INPUT')e.preventDefault();
  const res=a(el.dataset.v,el.dataset.w,e);if(res===false)return;
  e.stopPropagation();save();render();
});
document.addEventListener('input',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
  const parts=b.split('.');let o=S;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=e.target.value;save();
});
document.addEventListener('change',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b&&e.target.tagName==='SELECT'){render();}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.ui.modal){S.ui.modal=null;render();return;}
  const k=e.target.dataset&&e.target.dataset.enter;if(k&&e.key==='Enter'){e.preventDefault();e.target.blur();A[k](e.target.dataset.v);save();render();}
});

/* ---------- app start: an agent syncs the local Jira copy ---------- */
if(S.setup&&S.projects.length){S.ui.syncing=true;setTimeout(()=>{S.ui.syncing=false;S.jiraAt=Date.now();S.jiraLabel='al abrir la app';toast('Copia local de Jira al día.');dirty();},1500);}
setInterval(()=>{const r=route()[0];if(!S.ui.syncing&&(r==='hoy'||r==='p'||!r))dirty();},30000); // refresh "hace N min"
render();
</script>
