<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bienvenida</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5E4B0A}a:hover{color:#22211E}
.th{font-family:"Geist",system-ui,sans-serif;--bd:radial-gradient(60% 50% at 0% 40%,#CFE8D2 0%,transparent 70%),radial-gradient(60% 40% at 70% 0%,#BFE0EA 0%,transparent 70%),radial-gradient(60% 50% at 100% 100%,#F8F0C8 0%,transparent 70%),#EEF3EC;--sh:#F7F6F1;--pn:#EFEEE8;--fd:#FBFAF7;--ln:#E4E2DA;--tx:#22211E;--mu:#6B6860;--ac:#F3D54E;--on:#2A2410;--so:#FBF0C0;--st:#5E4B0A;--m1:#6E9A62;--m2:#B9D3A8;--m3:#E8C04A;--m4:#9EC3D6;--m5:#E4E2DA;--shadow:0 1px 2px rgba(40,40,30,.04),0 24px 60px rgba(40,50,40,.08)}
.th.dark{--bd:radial-gradient(60% 50% at 0% 40%,#1C3326 0%,transparent 70%),radial-gradient(60% 40% at 70% 0%,#173039 0%,transparent 70%),radial-gradient(60% 50% at 100% 100%,#3A3418 0%,transparent 70%),#121614;--sh:#1D1D1A;--pn:#252522;--fd:#2C2C28;--ln:#34332E;--tx:#ECEAE3;--mu:#A6A397;--ac:#E9C944;--on:#241E08;--so:#3A3318;--st:#F0D873;--m1:#8DBB7E;--m2:#4D6B44;--m3:#C9A43A;--m4:#5E8597;--m5:#34332E;--shadow:0 1px 2px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.35)}
.th a{color:var(--st)}
.th h1,.th h2,.th h3{margin:0;letter-spacing:-.02em;font-weight:500}
.th p,.th .me,.th .prose{font-family:"Newsreader",Georgia,serif}
.th p{margin:0}
.stage{width:1440px;height:900px;background:var(--bd);padding:20px;box-sizing:border-box;display:flex}
.sheet{flex:1;min-width:0;background:var(--sh);color:var(--tx);border-radius:28px;box-shadow:var(--shadow);display:flex;gap:28px;padding:26px 32px 26px 22px;overflow:hidden}
.rail{display:flex;flex-direction:column;gap:10px;align-items:center}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:var(--pn);color:var(--tx) !important;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.ib.on{background:var(--ac);color:var(--on) !important}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:15px;color:var(--mu) !important;text-decoration:none}
.k{font-size:13px;color:var(--mu);margin:0;font-weight:500}
.btn{font:inherit;font-size:15px;font-weight:500;padding:11px 20px;border-radius:12px;border:0;background:var(--pn);color:var(--tx) !important;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--ac);color:var(--on) !important}
.btn.s{background:var(--so);color:var(--st) !important}
.btn.f{background:var(--fd)}
.btn.g{background:transparent;color:var(--mu) !important;text-decoration:underline;text-underline-offset:4px}
.pill{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--pn);color:var(--mu)}
.pill.done{background:var(--so);color:var(--st)}
.pill.cur{background:var(--ac);color:var(--on);font-weight:500}
.panel{background:var(--pn);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;color:var(--tx);text-decoration:none}
.o{font:inherit;text-align:left;font-size:15px;padding:11px 14px;border-radius:12px;border:1.5px solid transparent;background:var(--pn);color:var(--tx);cursor:pointer}
.o.sel{border-color:var(--ac);background:var(--so);color:var(--st)}
.in{font:inherit;font-size:15px;padding:11px 14px;border-radius:12px;border:0;background:var(--pn);color:var(--tx);min-width:0}
.panel .in,.panel .o{background:var(--fd)}
.in::placeholder{color:var(--mu)}
.in:focus{outline:2px solid var(--ac);outline-offset:1px}
.me{align-self:flex-end;max-width:420px;background:var(--pn);border-radius:16px 16px 4px 16px;padding:11px 16px;font-size:17px;line-height:1.45}
.prose{font-size:18px;line-height:1.55}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.lg{display:flex;gap:14px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.sr{position:absolute;left:-9999px}
</style>
</helmet>
<div class="th {{mode}}">
<div class="stage">
<div class="sheet" style="flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px">
  <svg width="72" height="72" viewBox="0 0 40 40" role="img" aria-label="Logo Student Harness" style="color:var(--tx)"><circle cx="20" cy="20" r="16" fill="currentColor"></circle><circle cx="20" cy="20" r="6" fill="var(--sh)"></circle></svg>
  <h1 style="font-size:48px;line-height:1.1">Student Harness</h1>
  <p style="font-size:20px;color:var(--mu);max-width:560px;text-align:center;line-height:1.5">Para aprender de verdad, no para que te hagan la tarea. Elegís un tema y la IA te acompaña con métodos de estudio probados.</p>
  <section class="panel" aria-labelledby="antes" style="width:480px;font-size:15px;gap:12px">
    <h2 id="antes" style="font-size:16px">Antes de empezar</h2>
    <div style="display:flex;gap:10px;align-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--m1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"></path></svg><span>Motor de IA: Claude Code (paso del core)</span></div>
    <div style="display:flex;gap:10px;align-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--m3)" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="6"></circle></svg><span>Quién va a estudiar</span></div>
    <div style="display:flex;gap:10px;align-items:flex-start;color:var(--mu)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg><span>Si estudia un menor, lo ideal es que lo acompañe un adulto.</span></div>
  </section>
  <a class="btn p" href="Perfiles.dc.html" style="font-size:16px;padding:13px 32px">Empezar</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return { mode: this.props.dark ? 'dark' : 'light' }; }
}
</script>
</body>
</html>
