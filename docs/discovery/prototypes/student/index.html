function frac(s){const m=String(s||'').match(/(\d+)\s*\/\s*(\d+)/);return m?[+m[1],+m[2]]:null;}
const feq=(a,b)=>a&&b&&a[1]&&b[1]&&a[0]*b[1]===b[0]*a[1];
const STOP=new Set('para porque como cuando donde sobre entre desde hasta tiene tienen esta este estos estas que los las una uno unos unas del con por sus mas pero muy todo toda todos cada ese esa eso hace'.split(' '));

// Fake "AI" answer check: fractions by value, otherwise loose keyword overlap.
function checkAns(user,stored){
  const u=norm(user),s=norm(stored);if(!u)return false;if(u===s)return true;
  const fs=frac(stored);if(fs&&/^\d+\/\d+$/.test(s.replace(/ /g,'')))return feq(frac(user),fs);
  const ss=stems(stored),us=stems(user);if(!ss.length)return u.includes(s);
  const hit=ss.filter(x=>us.some(y=>y.startsWith(x.slice(0,4))||x.startsWith(y.slice(0,4)))).length;
  return hit>=(ss.length<=3?Math.ceil(ss.length*0.34):1);
}
function streakDays(c){let d=new Set();for(const e of c.ev){if(e.kind==='diag')continue;if(!e.ok)d=new Set();else d.add(e.day);}return d.size;}
// State machine: states move only with evidence.
function addEv(c,e){
  e.day=S.day;c.ev.push(e);
  if(e.kind==='diag'){if(c.state==='sin')c.state='visto';return;}
  if(!e.ok){c.state='practicando';return;}
  if(c.state==='repasar'){c.state='dominado';c.masteredDay=S.day;c.interval=Math.max(3,(c.interval||3)*2);return;}
  if(c.state==='sin'||c.state==='visto')c.state='practicando';
  if(c.state==='practicando'&&streakDays(c)>=2){c.state='dominado';c.masteredDay=S.day;c.interval=3;}
}

function paraHoy(p){
  p=p||P();if(!p.topics.length)return null;
  let best=null;
  for(const t of p.topics){const due=t.concepts.filter(c=>c.state==='repasar');const nx=nextConcept(t);const sc=due.length*10+(nx?3:0)+((t.lastDay??-99)/100);if(!best||sc>best.sc)best={t,due,nx,sc};}
  const {t,due,nx}=best;
  let text;

  else if(due.length)text=`${t.name}: repasar "${due.map(c=>c.name).join('", "')}"`;

  else text=`${t.name}: todo dominado. Un repaso de flashcards alcanza.`;

// Method recommendation from profile + concept + goal (scripted scoring).
function recommend(p,t,cids,goal){
  const sc={},why={};METHODS.forEach(m=>{sc[m.id]=0;why[m.id]=[];});
  const add=(id,n,r)=>{sc[id]+=n;if(r)why[id].push([n,r]);};
  const A=p.answers;const ex=kid(p)?'te':'te';
  if(A.stuck==='ejemplo')add('ej',3,'En tu perfil dijiste que te ayuda ver un ejemplo parecido.');
  if(A.stuck==='pista')add('soc',3,'Dijiste que te ayudan las pistas chiquitas: el socrático va de a poco.');
  if(A.stuck==='otraforma'){add('fey',2,'Dijiste que te ayuda verlo de otra forma: explicarlo vos lo da vuelta.');add('ela',2,'Dijiste que te ayuda verlo de otra forma: conectar ideas también.');}
  if(A.stuck==='solo')add('pro',3,'Te gusta pelearla solo un rato: arrancar de un problema te va a gustar.');
  if(A.how==='ejercicios'){add('ej',1,'Te gusta aprender haciendo ejercicios.');add('mez',1,'Te gusta aprender haciendo ejercicios.');}
  if(A.how==='explicando')add('fey',2,'Te gusta aprender explicándolo con tus palabras.');
  if(A.how==='preguntas')add('soc',2,'Te gustan las preguntas que hacen pensar.');
  if(A.how==='leyendo')add('ela',1,'Te gusta leer: la elaboración convierte la lectura en preguntas.');
  if(A.bored==='repetir'){sc.mem-=1;}
  const cs=(cids||[]).map(id=>CC(t,id)).filter(Boolean);
  const main=cs.find(c=>c.state!=='repasar')||cs[0];
  if(goal==='exam'){add('mez',3,'Para una prueba conviene practicar todo mezclado.');add('mem',2,'Para una prueba, sacar las cosas de memoria es lo que más rinde.');}
  else if(goal==='free'){add('ela',2,'Sesión libre: preguntarte por qué ayuda a explorar.');add('soc',1,'Sesión libre: ir de pregunta en pregunta.');}
  else if(main){
    const nm=`"${main.name}"`;
    if(main.state==='sin'||main.state==='visto'){add('ej',2,`${nm} es nuevo para vos: conviene construirlo de a poco.`);add('soc',2,`${nm} es nuevo: descubrirlo con preguntas lo fija mejor.`);}
    if(main.state==='practicando'){add('fey',2,`${nm} ya lo practicaste: explicarlo muestra si quedó firme.`);add('mez',1,`${nm} ya lo practicaste: mezclarlo con otros lo pone a prueba.`);if(t.kind==='frac'&&main.key==='eq')add('ej',1,'Equivalentes se entiende viendo cómo se transforma una fracción.');}
    if(main.state==='repasar')add('mem',3,`${nm} toca repasar: lo mejor es sacarlo de memoria.`);
    if(main.state==='dominado')add('mez',2,`${nm} ya lo dominás: mezclarlo con otros es el siguiente paso.`);
    if(main.ev.some(e=>e.kind==='hint'))add('ej',2,'La sesión pasada tuviste que pedir pistas acá.');
    if(main.hard)add('ej',1,'Marcaste que este concepto te cuesta.');
  }
  p.methods.fav.forEach(id=>add(id,2,'Es uno de tus métodos favoritos.'));
  const avail=METHODS.filter(m=>!p.methods.hidden.includes(m.id));
  const list=(avail.length?avail:METHODS).slice().sort((a,b)=>sc[b.id]-sc[a.id]);
  const best=list[0].id;
  const reasons=why[best].sort((a,b)=>b[0]-a[0]).map(x=>x[1]).filter((r,i,a)=>a.indexOf(r)===i).slice(0,3);
  if(!reasons.length)reasons.push('Es un buen punto de partida para este tema.');
  return {best,reasons,sc};
}

function sampleLine(p){

}

function knowsWhat(p){
  const A=p.answers,b=[];
  if(A.how==='ejercicios'||A.stuck==='ejemplo')b.push('recomendarte métodos con práctica y ejemplos');
  if(A.how==='explicando')b.push('pedirte que expliques con tus palabras');
  if(A.how==='preguntas'||A.stuck==='pista')b.push('ir con preguntas y pistas chiquitas');
  if(A.stuck==='otraforma')b.push('darte otra explicación cuando algo no cierra');
  if(A.stuck==='solo')b.push('dejarte pelearla antes de dar pistas');
  if(A.time)b.push(`armar sesiones de unos ${A.time} minutos`);
  if(A.bored==='texto')b.push('evitar textos largos');
  if(A.bored==='repetir')b.push('no repetir lo que ya dominás');
  if(A.bored==='escuchar')b.push('dejarte probar antes de explicar');
  if(A.talk==='paciente')b.push('hablarte con paciencia');
  if(A.talk==='exigente')b.push('desafiarte');
  if(young(p))b.push('usar ejemplos de la vida diaria y hablarte simple');
  if(!b.length)return 'Todavía no sabe mucho de vos. Con cada respuesta, se ajusta.';
  const s=b.join(', ');return s.charAt(0).toUpperCase()+s.slice(1)+'.';
}

function missing(t,c){
  const prev=t.concepts.filter(x=>x.col<c.col&&!masteredish(x));
  const pre=prev.length&&['sin','visto'].includes(c.state)?` Antes conviene: ${prev.slice(0,2).map(x=>'"'+x.name+'"').join(', ')}.`:'';
  if(c.state==='sin')return 'Verlo por primera vez: una sesión con este concepto.'+pre;
  if(c.state==='visto')return 'Practicarlo: un ejercicio, explicarlo o responder de memoria.'+pre;
  if(c.state==='practicando'){const s=streakDays(c);const today=c.ev.some(e=>e.day===S.day&&e.ok&&e.kind!=='diag');
    if(s>=1)return today?'Una evidencia más en otro día (hoy ya sumaste una). Volvé mañana.':'Una evidencia más en otro día: un ejercicio sin pistas, explicarlo sin huecos o responder de memoria.';
    return 'Un ejercicio sin pistas, o explicarlo con tus palabras sin huecos.';}
  if(c.state==='dominado'){const r=c.masteredDay+c.interval-S.day;return `Nada: lo dominás. Te lo vuelvo a preguntar ${r<=1?'mañana':'en '+r+' días'}.`;}
  return 'Responderlo de memoria: un repaso corto alcanza para volver a dominarlo.';
}
function stLabel(c){
  if(c.state==='repasar'){const last=[...c.ev].reverse().find(e=>e.ok);return last?rel(last.day):'';}
  return '';
}

        <div class="s12 muted">Un concepto sube solo con evidencia: respuestas de memoria correctas en días distintos, explicarlo sin huecos o un ejercicio sin pistas.</div>

      <div class="grow"></div><button class="btn p" data-a="startTopic" data-v="${t.id}" style="font-size:14px">Empezar sesión</button></div>
    <div role="tablist" class="tabs" style="padding-bottom:10px">${tabs.map(([k,l])=>`<button class="tab ${tab===k?'on':''}" role="tab" aria-selected="${tab===k}" data-a="tab" data-v="${k}">${l}</button>`).join('')}</div>

};

// ----- start session -----

  const chips=f.goal==='free'?'':`<div class="row" style="gap:6px;padding-left:28px">${f.cids.map(id=>{const c=CC(t,id);return c?`<button class="chip sel" data-a="stDelC" data-v="${id}" title="Sacar">${esc(c.name)} ×</button>`:'';}).join('')}<button class="chip" data-a="stMore">+ otro</button></div>
    ${S.ui.stMore?`<div class="row" style="gap:6px;padding-left:28px">${t.concepts.filter(c=>!f.cids.includes(c.id)).map(c=>`<button class="chip" data-a="stAddC" data-v="${c.id}">${esc(c.name)}</button>`).join('')||'<span class="s12 muted">Ya están todos.</span>'}</div>`:''}`;

    </section>
    <section class="card hi" aria-labelledby="b"><h2 id="b" style="font-size:16px">2 · ${isRec?'Método recomendado':'Método elegido'}</h2>
      <div style="font-size:20px;font-weight:600">${m.n}</div>
      <div style="font-size:14px;line-height:1.5">${m.long}</div>
      ${isRec?`<div class="k" style="margin-top:6px">Por qué este</div><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.6">${rec.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`
        :`<div class="s13 fg2" style="line-height:1.5">La IA recomendaba <strong>${MN(rec.best)}</strong>, pero elegís vos. <a data-a="stMethod" data-v="${rec.best}">Volver al recomendado</a></div>`}
      <div class="grow"></div>

// ----- session -----
function sctx(){
  const s=S.sess,p=P(),t=T(s.tid);
  const cs=s.cids.map(id=>CC(t,id)).filter(Boolean);
  const main=cs.find(c=>s.before[c.id]!=='repasar')||cs[0]||null;
  const N=main?main.name:t.name;
  const eqScript=t.kind==='frac'&&main&&main.key==='eq';
  return {s,p,t,cs,main,N,eqScript,y:young(p)};
}
function evid(cid,ok,kind,text){
  const s=S.sess;if(!cid)return;
  s.ev.push({cid,ok,kind,text});
  toast(ok?`Evidencia: ${text}`:`Anotado: ${text}`);
}
function bumpTries(st){st.tries=(st.tries||0)+1;}
function hintBtn(st,act){const n=P().settings.hintAfter;const ok=(st.tries||0)>=n;return `<button class="btn" data-a="${act}" ${ok?'':`title="Pista después de ${n} intentos"`}>Necesito una pista</button>`;}
function wantHint(st){const n=P().settings.hintAfter;if((st.tries||0)<n){toast(`Probá ${n-(st.tries||0)===1?'una vez más':(n-(st.tries||0))+' veces más'} antes de la pista. Así lo configuraste en tu perfil.`);return false;}return true;}
const AI=h=>`<div class="ai">${h}</div>`, ME=h=>`<div class="me">${esc(h)}</div>`;
function goalMet(){return `<div class="banner"><span>✓</span><span style="flex:1">Conseguiste evidencia para hoy. ¿Vamos al cierre? (También podés seguir o cambiar de método.)</span><button class="btn p" data-a="toClose">Ir al cierre</button></div>`;}

// Warm-up: recall questions from the student's own cards (due-review concepts first).
function warmQs(p,t,cids){
  const cards=p.cards.filter(k=>k.topicId===t.id);
  const rep=cards.filter(k=>{const c=CC(t,k.cid);return c&&c.state==='repasar';});
  const due=cards.filter(k=>k.due<=S.day&&!rep.includes(k));
  const inS=cards.filter(k=>cids.includes(k.cid)&&!rep.includes(k)&&!due.includes(k));
  const qs=[...rep,...due,...inS].slice(0,3).map(k=>({q:k.q,a:k.a,cid:k.cid,kid:k.id}));
  return qs;
}
function renderWarm(x){
  const w=x.s.warm;
  if(!w.qs.length)return `${AI('No hay nada para repasar de memoria en este tema todavía. Arrancamos directo con el bloque principal.')}<div><button class="btn p" data-a="toMain">Ir al bloque principal</button></div>`;
  if(w.i>=w.qs.length){const ok=w.res.filter(Boolean).length;return `${AI(`Calentamiento listo: <strong>${ok} de ${w.qs.length}</strong> de memoria. ${ok===w.qs.length?tonePre('ok'):'Lo que no salió lo vamos a ver de nuevo.'}`)}<div><button class="btn p" data-a="toMain">Seguir con ${MN(x.s.method).toLowerCase()}</button></div>`;}
  const q=w.qs[w.i],r=w.cur;
  return `${AI(x.y?'Arrancamos con unas preguntitas de memoria. Sin mirar nada.':'Primero, un calentamiento de memoria: sin mirar apuntes.')}
  <div class="ai hi"><span class="k">Calentamiento · ${w.i+1} de ${w.qs.length}</span><span style="font-size:17px;font-weight:600">${esc(q.q)}</span>
   ${r==null?`<input data-f="sess.warm.ans" data-enter="warmCheck" value="${esc(w.ans||'')}" placeholder="Tu respuesta" aria-label="Tu respuesta" autofocus><div class="row"><button class="btn p" data-a="warmCheck">Responder</button><button class="btn" data-a="warmCheck" data-v="idk">No me acuerdo</button></div>`
   :`<div class="note ${r?'ok':'bad'}"><b class="i ${r?'okc':'errc'}">${r?'✓':'✗'}</b><span>${r?tonePre('ok')+'Coincide con tu tarjeta.':'No coincide.'} <span class="muted">Tu tarjeta dice: ${esc(q.a)}</span></span></div><div><button class="btn p" data-a="warmNext">Siguiente</button></div>`}
  </div><div class="row"><button class="btn sm" data-a="toMain">Saltear el calentamiento</button></div>`;
}

// --- Socratic ---
function renderSoc(x){
  const st=x.s.blk.soc||(x.s.blk.soc={ph:'pre',log:[],tries:0});
  const subs=[['pre','Ejercicio previo'],['q','Preguntas'],['concept','Concepto'],['verify','Verificación']];
  const order=['pre','q1','q2','concept','verify','done'];const pi=order.indexOf(st.ph);
  const subIdx={pre:0,q1:1,q2:1,concept:2,verify:3,done:4}[st.ph];
  let html=`<div class="row" style="gap:6px"><span class="k">Sócrates:</span>${subs.map((s2,i)=>`<span class="sub ${i<subIdx?'done':i===subIdx?'on':''}">${s2[1]}</span>`).join('')}</div>`;
  html+=st.log.map(m=>m.me?ME(m.me):AI(m.ai)).join('');
  if(x.eqScript){
    const pre=x.y?{q:'Vos tenés una pizza cortada en 2 partes iguales y comés 1. Tu amiga tiene una pizza igual, cortada en 4, y come 2. ¿Quién comió más?',o:['Yo','Las dos igual','Mi amiga'],a:1}
      :{q:'Una receta pide 1/2 taza de harina. Tu vecino usa la misma receta pero mide con una taza marcada en cuartos y pone 2/4. ¿Quién pone más harina?',o:['Yo','Los dos lo mismo','Mi vecino'],a:1};
    st.pre=pre;
    if(st.ph==='pre'){if(!st.log.length)html+=AI('Antes de explicarte nada, probá con esto.');
      html+=`<div class="ai hi"><span class="k">Ejercicio previo</span><span>${pre.q}</span>
      <div class="grid3" style="gap:8px">${pre.o.map((o,i)=>`<button class="o ${st.sel===i?'sel':''}" style="font-size:14px;padding:12px 14px" data-a="socSel" data-v="${i}">${o}</button>`).join('')}</div>
      <label for="why" class="k">¿Por qué? (con tus palabras)</label><textarea id="why" rows="2" data-f="sess.blk.soc.why" placeholder="${x.y?'Porque…':'Mi razonamiento…'}">${esc(st.why||'')}</textarea>
      <div class="row"><button class="btn p" data-a="socCommit">Me comprometo</button>${hintBtn(st,'socHint')}</div>
      <span class="s12 muted">La respuesta llega recién cuando te comprometés. Pista después de ${x.p.settings.hintAfter} ${x.p.settings.hintAfter===1?'intento':'intentos'}.</span></div>`;}
    if(st.ph==='q1')html+=`<div class="ai hi"><span class="k">Pregunta</span><span>${x.y?'Si la pizza de tu amiga estuviera cortada en 8 porciones, ¿cuántas tendría que comer para comer lo mismo que vos?':'Si tu vecino midiera con una taza marcada en octavos, ¿cuántos octavos tendría que poner?'}</span>
      <input data-f="sess.blk.soc.a" data-enter="socQ1" value="${esc(st.a||'')}" placeholder="Un número" aria-label="Tu respuesta"><div class="row"><button class="btn p" data-a="socQ1">Responder</button>${hintBtn(st,'socHint')}</div></div>`;
    if(st.ph==='q2')html+=`<div class="ai hi"><span class="k">Pregunta</span><span>Mirá los números: pasamos de 1/2 a 2/4 y a 4/8. ¿Qué le pasó al número de arriba y qué al de abajo?</span>
      <textarea rows="2" data-f="sess.blk.soc.b" placeholder="Con tus palabras">${esc(st.b||'')}</textarea><div class="row"><button class="btn p" data-a="socQ2">Responder</button>${hintBtn(st,'socHint')}</div></div>`;
    if(st.ph==='concept')html+=`<div class="ai hi"><span class="k">Concepto</span><span>Eso que descubriste tiene nombre: <strong>fracciones equivalentes</strong>. Valen lo mismo aunque tengan números distintos. Si multiplicás (o dividís) el de arriba <strong>y</strong> el de abajo por el mismo número, la cantidad no cambia.</span><div><button class="btn p" data-a="socConcept">Entendido, probame</button></div></div>`;
    if(st.ph==='verify')html+=`<div class="ai hi"><span class="k">Verificación</span><span>Escribí una fracción equivalente a <span class="big">3/5</span> (que no sea 3/5).</span>
      <input class="mono" data-f="sess.blk.soc.v" data-enter="socVerify" value="${esc(st.v||'')}" placeholder="?/?" aria-label="Fracción"><div class="row"><button class="btn p" data-a="socVerify">Comprobar</button>${hintBtn(st,'socHint')}</div></div>`;
  } else {
    if(st.ph==='pre'){if(!st.log.length)html+=AI(`Antes de explicarte nada sobre "${esc(x.N)}", comprometete con lo que pensás.`);
      html+=`<div class="ai hi"><span class="k">Ejercicio previo</span><span>¿Qué tan bien podrías explicar "${esc(x.N)}" ahora mismo?</span>
      <div class="grid3" style="gap:8px">${['Lo puedo explicar','Me suena, pero no sé explicarlo','No sé qué es'].map((o,i)=>`<button class="o ${st.sel===i?'sel':''}" style="font-size:14px;padding:12px 14px" data-a="socSel" data-v="${i}">${o}</button>`).join('')}</div>
      <label for="why" class="k">¿Qué creés que es? (aunque no estés seguro)</label><textarea id="why" rows="2" data-f="sess.blk.soc.why">${esc(st.why||'')}</textarea>
      <div class="row"><button class="btn p" data-a="socCommit">Me comprometo</button>${hintBtn(st,'socHint')}</div>
      <span class="s12 muted">Contenido genérico de demo: con un motor real, las preguntas salen del tema y tu material.</span></div>`;}
    if(st.ph==='q1')html+=`<div class="ai hi"><span class="k">Pregunta</span><span>¿Qué ejemplo concreto se te ocurre de "${esc(x.N)}"?</span><textarea rows="2" data-f="sess.blk.soc.a">${esc(st.a||'')}</textarea><div class="row"><button class="btn p" data-a="socQ1">Responder</button>${hintBtn(st,'socHint')}</div></div>`;

function analyzeFey(text,eq){
  const sents=text.trim().split(/(?<=[.!?])\s+/).filter(Boolean);const notes=[];const marks=sents.map(s=>({s,ok:true}));
  if(eq){
    const central=/mism|igual/i.test(text),example=/\d+\s*\/\s*\d+/.test(text),how=/multiplic|dividi|por \d|x ?\d|×/i.test(text),both=/abajo|denominador|los dos|ambos|arriba y abajo/i.test(text);
    if(central&&example)notes.push(['ok','La idea central está clara, y el ejemplo es correcto.']);
    else if(central)notes.push(['ok','La idea central está clara.']);
    if(!central)notes.push(['gap','<strong>Hueco:</strong> falta la idea central. ¿Qué tienen en común dos fracciones equivalentes?']);
    if(!example)notes.push(['gap','<strong>Hueco:</strong> sumá un ejemplo con números, para que se vea.']);
    if(!how)notes.push(['gap','<strong>Hueco:</strong> ¿cómo hacés para conseguir una fracción equivalente a otra?']);
    else if(!both){notes.push(['gap','<strong>Hueco:</strong> si solo multiplicás el de arriba, 1/2 se convierte en 2/2. ¿Qué tiene que pasar con el de abajo para que siga valiendo lo mismo?']);marks.forEach(m=>{if(/multiplic|dividi|por \d|×/i.test(m.s))m.ok=false;});}
    if(!central||!example)marks.forEach(m=>{if(sents.length===1)m.ok=false;});
  } else {
    const long=text.trim().length>=60,example=/ejemplo|como cuando|por ejemplo|\bcomo\b/i.test(text);
    if(long)notes.push(['ok','Está explicado con tus palabras.']);else{notes.push(['gap','<strong>Hueco:</strong> es muy corta. ¿Qué es y para qué sirve?']);marks.forEach(m=>m.ok=false);}
    if(!example)notes.push(['gap','<strong>Hueco:</strong> falta un ejemplo concreto ("por ejemplo…").']);
  }
  return {marks,notes,gaps:notes.filter(n=>n[0]==='gap').length};
}

        ${s.part==='main'&&!evs.some(e=>e.cid===(x.main&&x.main.id))?`<br><span class="muted">…</span> ${esc(x.N)}: en curso`:''}</div>
      ${s.openQs.length?`<div class="k" style="margin-top:10px">Preguntas anotadas</div><div class="s13">${s.openQs.map(esc).join('<br>')}</div>`:''}
      <div class="k" style="margin-top:10px">Términos nuevos</div><div class="s13">${esc(terms)}</div>
      <div class="grow"></div>
      <div class="s12 muted" style="line-height:1.5">${minor(x.p)?'Estudiás con un adulto al lado: la IA habla simple y usa ejemplos de la vida diaria.':`Tono: ${x.p.settings.tone} · explicaciones ${x.p.settings.expl} · pista después de ${x.p.settings.hintAfter} intentos.`}</div>
    </aside>
  </div></div>`;
};

// ----- close -----
function reviewClose(x,f){
  const eq=x.t.kind==='frac';
  const sn=[];const t=f.sum.trim();
  if(t.length<25)sn.push(['gap','Es muy corto. ¿Qué es lo central de lo que viste hoy y cómo se hace?']);
  else{
    let wrong=false;
    if(eq&&/multiplic/i.test(t)&&!/arriba y abajo|numerador y denominador|los dos|ambos|y abajo/i.test(t)){sn.push(['bad','Si multiplicás solo uno de los números, la fracción cambia. ¿Qué pasa con el otro?']);wrong=true;}
    if(!wrong)sn.push(['ok',`Correcto${t.length>80?' y completo':''}.${/\d+\s*\/\s*\d+|por ejemplo|ejemplo/i.test(t)?' Usaste tu propio ejemplo: bien.':''}`]);
    if(eq&&/dividi/i.test(t)&&!/mismo n|si los dos|se pueden dividir|por el mismo/i.test(t))sn.push(['gap','"También se puede dividir": es cierto, pero solo si los dos números se pueden dividir por el mismo. Eso es "Simplificar", que vemos después. ¿Lo aclarás o lo dejás para ese tema?','divide']);
  }
  const cn=f.cards.map(c=>{
    const q=c.q.trim(),a=c.a.trim();if(!q&&!a)return null;
    if(!q)return ['gap','Falta la pregunta.'];if(!a)return ['gap','Falta la respuesta.'];
    if(q.length<6)return ['gap','La pregunta es muy corta: ¿se va a entender dentro de una semana?'];
    const m=q.match(/equivalente a\s*(\d+)\s*\/\s*(\d+)/i),fa=frac(a);
    if(m&&fa){const base=[+m[1],+m[2]];if(!feq(fa,base)){const half=feq(fa,[1,2]);return ['bad',`${esc(a)} ${half?'es la mitad, no '+esc(m[1]+'/'+m[2]):'no vale lo mismo que '+esc(m[1]+'/'+m[2])}. Probá multiplicando arriba <strong>y abajo</strong>.`];}
      if(fa[0]===base[0]&&fa[1]===base[1])return ['gap','Es la misma fracción: buscá una distinta que valga lo mismo.'];}
    const mc=q.match(/(\d+\/\d+)\s*o\s*(\d+\/\d+)/);if(mc&&fa){const A=frac(mc[1]),B=frac(mc[2]);const big=A[0]/A[1]>B[0]/B[1]?A:B;if(!feq(fa,big))return ['bad','Revisalo: con porciones más chicas comés menos.'];}
    return ['ok','Bien.'];
  });
  return {sn,cn,at:Date.now()};
}
function renderClose(x){
  const f=x.s.close;const r=f.rev;
  const nt=(n)=>`<div class="note ${n[0]}"><b class="i ${n[0]==='ok'?'okc':n[0]==='bad'?'errc':'warnc'}">${n[0]==='ok'?'✓':n[0]==='bad'?'✗':'?'}</b><span>${n[1]}</span></div>`;
  return `<div class="grid2" style="align-items:start">

      <label for="res" class="sr">Resumen</label><textarea id="res" rows="6" data-f="sess.close.sum" style="font-size:15px;line-height:1.6" placeholder="${x.y?'Hoy aprendí que…':'Lo central de hoy…'}">${esc(f.sum)}</textarea>

// ----- finish -----
function finishSession(skipClose){
  const x=sctx(),s=x.s,t=x.t,p=x.p;
  const before={};t.concepts.forEach(c=>before[c.id]=c.state);
  const per={};
  s.ev.forEach(e=>{const c=CC(t,e.cid);if(!c)return;addEv(c,{ok:e.ok,kind:e.kind,text:e.text});(per[c.id]=per[c.id]||[]).push(e);});
  let nCards=0,hasSum=false;const openQs=[...s.openQs];
  if(!skipClose){
    const f=s.close,r=reviewClose(x,f);
    const target=(x.main||x.cs[0]);
    f.cards.forEach(c=>{if(c.q.trim()&&c.a.trim()){p.cards.push({id:uid('k'),topicId:t.id,cid:target?target.id:null,q:c.q.trim(),a:c.a.trim(),due:S.day+1,interval:1,lastOk:null});nCards++;}});
    if(f.sum.trim()){hasSum=true;t.summaries.push({cid:target?target.id:null,text:f.sum.trim(),ok:!r.sn.some(n=>n[0]!=='ok'),day:S.day});}
    if(r.sn.some(n=>n[2]==='divide'))openQs.push('¿Cuándo se puede dividir? → para "Simplificar"');
  }
  openQs.forEach(q=>{if(!t.openQs.includes(q))t.openQs.push(q);});
  const minutes=Math.max(1,Math.round((Date.now()-s.start)/60000));
  const used=(s.used&&s.used.length?s.used:[s.method]).map(MN).join(', ');
  t.sessions.push({day:S.day,method:used,minutes,note:x.cs.map(c=>c.name).join(' · ')||'Sesión libre'});
  t.lastDay=S.day;
  const rows=Object.keys(per).map(cid=>{
    const c=CC(t,cid),es=per[cid],from=before[cid],to=c.state,ok=es.filter(e=>e.ok).length,rec=es.filter(e=>e.kind==='recall');
    let why;
    if(from==='repasar'&&to==='dominado'){const prevOk=c.ev.slice(0,-es.length).filter(e=>e.ok).pop();why=`Evidencia: ${rec.filter(e=>e.ok).length||ok} de ${rec.length||es.length} de memoria${prevOk?`, ${S.day-prevOk.day} días después de la última vez`:''}. Vuelve a repaso en ${c.interval} días.`;}
    else if(to==='dominado'&&from!=='dominado')why=`${es.filter(e=>e.ok).pop().text}. Evidencia en 2 días distintos: ya lo dominás. Repaso en ${c.interval} días.`;
    else if(to==='practicando'&&es.some(e=>!e.ok))why=`${es.filter(e=>!e.ok).pop().text}. Sin apuro: se vuelve a practicar.`;
    else if(to==='practicando'&&streakDays(c)===1)why=`${es.filter(e=>e.ok).pop().text}. Falta una evidencia más en otro día para dominarlo.`;
    else why=es.map(e=>e.text).join(' · ');
    return {name:c.name,from,to,why};
  });
  const h=paraHoy(p);
  S.fin={tid:t.id,minutes,method:used,nCards,hasSum,rows,openQs,next:h?h.text:'',nextEq:h};
  S.sess=null;go('fin');
}

// ----- flashcards review -----
function buildQueue(p){
  const by={};dueCards(p).forEach(k=>(by[k.topicId]=by[k.topicId]||[]).push(k.id));
  const lists=Object.values(by),q=[];let i=0;
  while(lists.some(l=>l.length)){const l=lists[i%lists.length];if(l.length)q.push(l.shift());i++;}
  return {queue:q,i:0,ans:'',checked:null,done:{},evid:0,changed:[]};
}
const ivs=k=>({bien:Math.max(4,k.interval*2),facil:Math.max(10,k.interval*3)});
V.review=()=>{
  const p=P();if(!S.rev)S.rev=buildQueue(p);const r=S.rev;

    ${r.queue.map((id,i)=>{const k=kc(id);return k?`<div class="q" style="${i===r.i?'font-weight:600':''}"><span class="${i<r.i?(r.done[i]?'okc':'errc'):'muted'}">${i<r.i?(r.done[i]?'✓':'✗'):i===r.i?'›':'○'}</span><span style="flex:1">${esc(k.q)}</span></div>`:'';}).join('')||'<div class="s13 muted">Nada para hoy.</div>'}
    <div class="grow"></div><div class="s12 muted" style="line-height:1.5">Mezcla tarjetas de tus ${p.topics.length} temas: practicar mezclado ayuda a recordar.</div></aside>`;

  else if(r.i>=r.queue.length)mainH=`<div class="card" style="width:640px;max-width:100%;text-align:center;align-items:center"><div style="font-size:22px;font-weight:600">${kid(p)?'¡Listo por hoy!':'Listo por hoy'}</div><div class="s15 fg2">${r.queue.length} tarjetas · ${r.evid} respuestas correctas sumaron evidencia</div>${r.changed.length?`<div class="s13" style="line-height:1.6">${r.changed.map(esc).join('<br>')}</div>`:''}<button class="btn p" data-a="go" data-v="home">Volver al inicio</button></div>`;
  else{
    const k=kc(r.queue[r.i]),t=T(k.topicId),iv=ivs(k);
    mainH=`<section aria-label="Tarjeta" class="card" style="width:640px;max-width:100%;border-radius:20px;padding:36px;gap:18px;box-shadow:0 8px 24px var(--shadow)">
      <span class="k">${esc(t.name)} · escrita por vos</span>

      <label for="ans" class="k">Respondé de memoria</label>
      ${r.checked==null?`<input id="ans" data-f="rev.ans" data-enter="revCheck" value="${esc(r.ans)}" style="font-size:16px;padding:12px" autofocus><div class="row"><button class="btn p" data-a="revCheck">Comprobar</button><button class="btn" data-a="revCheck" data-v="idk">No me acuerdo</button></div>`
       :`<div style="font-size:16px;padding:12px;border:1px solid var(--line2);border-radius:10px">${esc(r.ans)||'<span class="muted">(sin respuesta)</span>'}</div>
       <div style="background:${r.checked?'var(--ok-soft)':'var(--wait-soft)'};border-radius:12px;padding:14px;font-size:14px;line-height:1.5"><strong>Tu respuesta guardada:</strong> ${esc(k.a)}<br><span class="${r.checked?'okc':'warnc'}">La IA: ${r.checked?(norm(r.ans).length>norm(k.a).length+8?'correcta, y más completa que la original.':'correcta.'):'no coincide. Mirá la diferencia antes de puntuar.'}</span></div>

  socCommit:()=>{const x=sctx(),st=x.s.blk.soc;if(st.sel==null){toast('Elegí una opción.');return;}if(!String(st.why||'').trim()){toast('Escribí por qué, con tus palabras. Es parte del ejercicio.');return;}

      :{pre:'Pista: pensá dónde lo viste por primera vez.',q1:'Pista: pensá en algo de todos los días.',q2:'Pista: mirá el mapa del tema.',verify:'Pista: usá tus propias palabras de antes.'};

  socQ1:()=>{const x=sctx(),st=x.s.blk.soc;const a=String(st.a||'').trim();if(!a)return;st.log.push({me:a});

  setMethodSel:v=>A.setMethod(v),

  setAnswer:(v,el)=>{const p=P(),k=el.dataset.k;if(k==='age')p.age=v;else p.answers[k]=v;S.ui.editAns=null;toast('Guardado.');render();},
};
function openStart(tid,cids){const p=P();const t=T(tid);S.ui.st={tid,cids:cids.slice(),orig:cids.slice(),goal:'obj',time:+(p.answers.time||20),method:null,autoM:true};S.ui.stMore=false;go('start');}

// ---------- render / events ----------
function setPath(path,val){const ks=path.split('.');let o=S;for(let i=0;i<ks.length-1;i++){o=o[ks[i]];if(o==null)return;}o[ks[ks.length-1]]=val;}
function render(){
  if(!S.cur&&!['welcome','profiles'].includes(S.view))S.view=S.firstRun?'welcome':'profiles';
  if(S.view==='session'&&!S.sess)S.view='home';
  if(S.view==='start'&&!S.ui.st)S.view='home';
  if((S.view==='newtopic'||S.view==='map')&&!S.nt)S.view='home';
  if(S.view==='diag'&&!S.diag)S.view='home';
  if(S.view==='fin'&&!S.fin)S.view='home';
  if(S.view==='know'&&S.ui.ki==null)S.ui.ki=0;
  const ae=document.activeElement;const focusKey=ae&&ae.dataset&&ae.dataset.f;const sel=focusKey&&ae.selectionStart;
  $('#app').innerHTML=(V[S.view]||V.home)();
  const m=S.ui.modal;
  $('#modal').innerHTML=m?`<div class="mback"><div class="modal" role="dialog" aria-modal="true"><h2 style="font-size:17px">${esc(m.title)}</h2><div class="s13 fg2" style="line-height:1.5">${esc(m.body)}</div><div class="row" style="justify-content:flex-end">${m.actions.map(a=>`<button class="btn ${a[3]?'p':''}" data-a="${a[1]}" ${a[2]!=null?`data-v="${a[2]}"`:''}>${esc(a[0])}</button>`).join('')}</div></div></div>`:'';
  $('#demo').innerHTML=`<span>Demo · día ${S.day}</span><button data-a="advanceDay" title="Simula que pasó un día">Avanzar un día</button><button data-a="askReset">Reiniciar demo</button>`;
  if(focusKey){const el=document.querySelector(`[data-f="${focusKey}"]`);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel);}catch(e){}}}
  else{const af=document.querySelector('#app [autofocus]');if(af&&window.innerWidth>760)af.focus({preventScroll:true});}
  save();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const fn=A[t.dataset.a];if(!fn)return;e.preventDefault();fn(t.dataset.v,t,e);});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.f){setPath(t.dataset.f,t.value);if(t.dataset.f==='ui.np.name'&&S.ui.np&&S.ui.np.err&&t.value.trim()){S.ui.np.err=false;}}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.c&&CH[t.dataset.c])CH[t.dataset.c](t.value,t);});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.enter&&t.tagName==='INPUT'){e.preventDefault();A[t.dataset.enter]();}if(e.key==='Escape'&&S.ui.modal){A.closeModal();}});
setInterval(()=>{if(S.view!=='session'||!S.sess)return;const el=$('#timer');if(el)el.textContent=timerText();
  if(S.sess.time&&!S.sess.timeUp&&(Date.now()-S.sess.start)>S.sess.time*60000){S.sess.timeUp=true;toast('Se terminó el tiempo que elegiste. Cuando quieras, vamos al cierre.');}},1000);
load();render();
</script>
