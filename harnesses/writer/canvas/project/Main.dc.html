<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bienvenida</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1280px;height:900px;box-sizing:border-box;{{vars}};background:var(--bg);color:var(--ink);font:14px/1.5 'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;max-width:520px;text-align:center">
    <div style="font-family:Newsreader,Georgia,serif;font-size:44px;line-height:1.1;font-weight:500">Writer</div>
    <p style="margin:0;font-size:16px;color:var(--muted)">Escribí tu novela con una IA que escribe con vos, lee lo que escribiste y aprende tu voz.</p>
  </div>
  <div style="width:440px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px;display:flex;flex-direction:column;gap:12px">
    <div style="font-size:12px;font-weight:600;color:var(--muted)">Antes de empezar</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="background:var(--green);color:var(--greenInk);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600">Listo</span>
      <span>Claude conectado</span>
      <span style="flex:1"></span>
      <span style="color:var(--muted);font-size:12px">del core</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="background:var(--green);color:var(--greenInk);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600">Listo</span>
      <span>Carpeta de novelas: Documentos/Writer</span>
    </div>
  </div>
  <a href="Inicio{{sfx}}.dc.html" style="background:var(--cta);color:var(--ctaInk);text-decoration:none;font-weight:600;font-size:16px;border-radius:12px;padding:14px 40px;min-height:44px;box-sizing:border-box">Empezar</a>
  <p style="margin:0;font-size:12px;color:var(--muted)">Esta pantalla es la del core: conectar el motor y elegir dónde se guardan las novelas.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const d = this.props.dark ?? false;
const L = "--bg:#f3f3f1;--rail:#fbfbfa;--surface:#ffffff;--s2:#f2f2ef;--line:#e7e7e3;--lineS:#d9d9d4;--ink:#1b1c1e;--muted:#62656b;--faint:#a6a9ae;--cta:#fbd38d;--ctaInk:#3b2a06;--active:#fde6b3;--activeInk:#7a4f00;--green:#dff2e5;--greenInk:#1d6e3f;--orange:#fdebd7;--orangeInk:#a94f08;--blue:#e4ecfd;--blueInk:#2d55c4;--violet:#ece6fb;--violetInk:#5f3dba;--red:#fde2e1;--redInk:#b42318;--grey:#ececea;--greyInk:#4d5056;--page:#ebebe7;--paper:#ffffff";
const D = "--bg:#121315;--rail:#16171a;--surface:#1e2024;--s2:#26292e;--line:#2a2d32;--lineS:#383c42;--ink:#eceef0;--muted:#a3a8ae;--faint:#5a5e64;--cta:#f3c56a;--ctaInk:#2a1d02;--active:#3a2e14;--activeInk:#f3c56a;--green:#17311f;--greenInk:#8bd8a8;--orange:#3a2715;--orangeInk:#f4b47e;--blue:#1c2944;--blueInk:#a3beff;--violet:#29223f;--violetInk:#c6b4ff;--red:#3a1a1a;--redInk:#ff9b94;--grey:#26292e;--greyInk:#c2c6cc;--page:#0d0e10;--paper:#1a1b1e;color-scheme:dark";
return { vars: d ? D : L, sfx: d ? "Oscuro" : "" };
}
}
</script>
</body>
</html>
