<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1280px;height:900px;box-sizing:border-box;{{vars}};background:var(--bg);color:var(--ink);font:14px/1.5 'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--rail);font-size:13px;color:var(--muted)">
    <span style="font-weight:600;color:var(--ink)">Writer</span>
    <span style="flex:1"></span>
    <span>Notas</span>
    <span>Ajustes</span>
  </div>
  <div style="flex:1;display:flex;justify-content:center;padding-top:72px">
    <div style="width:680px;display:flex;flex-direction:column;gap:24px">
      <div style="display:flex;align-items:flex-end;gap:16px">
        <div style="flex:1">
          <div style="font-size:24px;font-weight:600">Seguí donde quedaste</div>
          <div style="color:var(--muted)">Lo último que trabajaste.</div>
        </div>
        <a href="NuevaNovela{{sfx}}.dc.html" style="background:var(--cta);color:var(--ctaInk);text-decoration:none;font-weight:600;font-size:15px;border-radius:12px;padding:12px 28px;min-height:44px;box-sizing:border-box">Nueva novela</a>
      </div>
      <div style="display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden">
        <a href="Hoja{{sfx}}.dc.html" style="display:flex;align-items:center;gap:16px;padding:16px 24px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)">
          <div style="flex:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-family:Newsreader,Georgia,serif;font-size:21px;font-weight:500">La sal del faro</span>
            <span style="color:var(--muted);font-size:13px">Cap. 7 · La niebla · 41.200 palabras</span>
          </div>
          <span style="color:var(--muted);font-size:13px">hoy, 10:42</span>
          <span style="background:var(--cta);color:var(--ctaInk);font-weight:600;border-radius:8px;padding:8px 16px">Seguir</span>
        </a>
        <div style="display:flex;align-items:center;gap:16px;padding:16px 24px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)">
          <div style="flex:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-family:Newsreader,Georgia,serif;font-size:21px;font-weight:500">Los años de la grúa</span>
            <span style="color:var(--muted);font-size:13px">Cap. 2 · 6.900 palabras</span>
          </div>
          <span style="color:var(--muted);font-size:13px">hace 3 semanas</span>
          <span style="border:1px solid var(--lineS);border-radius:8px;padding:7px 16px">Abrir</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;padding:16px 24px;text-decoration:none;color:var(--ink);">
          <div style="flex:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-family:Newsreader,Georgia,serif;font-size:21px;font-weight:500">Diario de Ushuaia</span>
            <span style="color:var(--muted);font-size:13px">Cap. 11 · 38.000 palabras</span>
          </div>
          <span style="color:var(--muted);font-size:13px">en julio</span>
          <span style="border:1px solid var(--lineS);border-radius:8px;padding:7px 16px">Abrir</span>
        </div>
      </div>
      <a href="SagaInicio{{sfx}}.dc.html" style="color:var(--muted);text-decoration:underline;text-underline-offset:4px;align-self:flex-start">Todas las novelas (12)</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const d = this.props.dark ?? false;
const L = "--bg:#f3f3f1;--rail:#fbfbfa;--surface:#ffffff;--s2:#f2f2ef;--line:#e7e7e3;--lineS:#d9d9d4;--ink:#1b1c1e;--muted:#62656b;--faint:#a6a9ae;--cta:#fbd38d;--ctaInk:#3b2a06;--active:#fde6b3;--activeInk:#7a4f00;--green:#dff2e5;--greenInk:#1d6e3f;--orange:#fdebd7;--orangeInk:#a94f08;--blue:#e4ecfd;--blueInk:#2d55c4;--violet:#ece6fb;--violetInk:#5f3dba;--red:#fde2e1;--redInk:#b42318;--grey:#ececea;--greyInk:#4d5056;--page:#ebebe7;--paper:#ffffff";
const D = "--bg:#121315;--rail:#16171a;--surface:#1e2024;--s2:#26292e;--line:#2a2d32;--lineS:#383c42;--ink:#eceef0;--muted:#a3a8ae;--faint:#5a5e64;--cta:#f3c56a;--ctaInk:#2a1d02;--active:#3a2e14;--activeInk:#f3c56a;--green:#17311f;--greenInk:#8bd8a8;--orange:#3a2715;--orangeInk:#f4b47e;--blue:#1c2944;--blueInk:#a3beff;--violet:#29223f;--violetInk:#c6b4ff;--red:#3a1a1a;--redInk:#ff9b94;--grey:#26292e;--greyInk:#c2c6cc;--page:#0d0e10;--paper:#1a1b1e;color-scheme:dark";
return { vars: d ? D : L, sfx: d ? "Oscuro" : "" };
}
}
</script>
</body>
</html>
